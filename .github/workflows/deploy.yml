name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: 🚀 FTP Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '145.79.213.119' }}
          username: ${{ secrets.FTP_USERNAME || 'u729386670.bbmschool.com' }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 120000
